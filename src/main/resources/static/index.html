<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Placement Management System</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="top"><h1>Student Placement Management System</h1></header>
<main class="center"><div class="card auth">
  <div class="tabs"><button id="tl" class="active" type="button">Login</button><button id="tr" type="button">Student Register</button></div>
  <form id="login">
    <label>Username</label><input id="lu" required autocomplete="username">
    <label>Password</label><input id="lp" type="password" required autocomplete="current-password">
    <button class="btn">Login</button>
  </form>
  <form id="reg" style="display:none">
    <div class="row">
      <div><label>Username *</label><input id="ru" required></div>
      <div><label>Password * (min 6)</label><input id="rp" type="password" required minlength="6"></div>
      <div><label>Full name *</label><input id="rn" required></div>
      <div><label>Email</label><input id="re" type="email"></div>
      <div><label>Phone</label><input id="rph"></div>
      <div><label>Branch</label><select id="rb"><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>OTHER</option></select></div>
      <div><label>CGPA</label><input id="rc" type="number" step="0.01" min="0" max="10" value="0"></div>
      <div><label>Backlogs</label><input id="rbk" type="number" min="0" value="0"></div>
    </div>
    <label>Skills (comma separated)</label><input id="rs">
    <button class="btn">Register</button>
  </form>
  <p id="msg" class="msg"></p>
</div></main>
<script src="/js/app.js"></script>
<script>
const msg=(t,ok)=>{$('msg').textContent=t;$('msg').className='msg'+(ok?' ok':'')};
function sw(w){$('login').style.display=w==='login'?'block':'none';$('reg').style.display=w==='reg'?'block':'none';
  $('tl').classList.toggle('active',w==='login');$('tr').classList.toggle('active',w==='reg');msg('')}
$('tl').onclick=()=>sw('login');$('tr').onclick=()=>sw('reg');

fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.authenticated)location.href=d.role==='ADMIN'?'/admin.html':'/student.html'});

$('login').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({username:$('lu').value.trim(),password:$('lp').value})});
  if(r.ok){const d=await r.json();location.href=d.role==='ADMIN'?'/admin.html':'/student.html'}
  else msg('Invalid username or password');
});

$('reg').addEventListener('submit',async e=>{
  e.preventDefault();
  const body={username:$('ru').value,password:$('rp').value,name:$('rn').value,email:$('re').value,phone:$('rph').value,
    branch:$('rb').value,cgpa:parseFloat($('rc').value||0),backlogs:parseInt($('rbk').value||0),skills:$('rs').value};
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(r.ok){sw('login');$('lu').value=body.username;msg('Registered. Please login.',true)}
  else msg(d.message||'Registration failed');
});
</script>
</body></html>
