server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=always
spring.application.name=placement-system

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:placement_db}?${DB_OPTIONS:createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:NewPass@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.admin.username=${ADMIN_USERNAME:srinidhi}
app.admin.password=${ADMIN_PASSWORD:3216}
